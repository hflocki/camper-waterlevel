; Camper Waterlevel - PlatformIO project
;
; The source code is shared with the Arduino IDE version and lives in
; ../_arduino/camper_waterlevel (one code base, two ways to build it).
;
; Build:            pio run
; Upload firmware:  pio run -t upload
; Upload web UI:    pio run -t uploadfs        (uploads data/ to LittleFS)
; Serial monitor:   pio device monitor
; Classic ESP32:    add  -e esp32dev  to the commands above
; OTA (ESP32-C3):   OTA_PASSWORD=<your ota password> pio run -e ota -t upload

[platformio]
default_envs = esp32c3
src_dir = ../_arduino/camper_waterlevel
data_dir = ../_arduino/camper_waterlevel/data

[env]
; pioarduino provides the Arduino core 3.x (ESP-IDF 5.x). The official espressif32
; platform only ships Arduino core 2.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
; "Default 4MB with spiffs" partition table (2 x 1.25 MB app, 1.4 MB LittleFS)
board_build.partitions = default.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    ESP32Async/ESPAsyncWebServer@^3.12.1
    ESP32Async/AsyncTCP@^3.5.0

; ESP32-C3 (e.g. Super Mini) - sensor on GPIO0
[env:esp32c3]
board = esp32-c3-devkitm-1
; Native USB serial of the ESP32-C3 (without these flags there is no serial output)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Classic ESP32 DevKit (ESP32-WROOM-32) - set ADC_PIN to 34 in config.h first!
[env:esp32dev]
board = esp32dev

; ESP32-C3 firmware update over WiFi (ESP and computer in the same network).
; For a classic ESP32 change "extends" to env:esp32dev.
[env:ota]
extends = env:esp32c3
upload_protocol = espota
upload_port = camper-waterlevel.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
